name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: App version, placeholder: "0.1.0-beta.1" }
    validations: { required: true }
  - type: input
    id: windows
    attributes: { label: Windows version, placeholder: "Windows 11 23H2" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened, description: What did you expect instead? }
    validations: { required: true }
  - type: textarea
    id: probe
    attributes:
      label: Output of `lgp-battery-monitor.exe --probe`
      render: text
