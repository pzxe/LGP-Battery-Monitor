[package]
name = "lgp-battery-monitor"
version = "1.0.0"
edition = "2024"
description = "A lightweight Windows system tray battery monitor for the Logitech G Pro X Superlight 2."
license = "MIT"
repository = "https://github.com/pzxe/LGP-Battery-Monitor"

[dependencies]
chrono = "0.4.45"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-winrt-notification = "0.8.1"
tray-icon = "0.26.1"
ureq = "3.5.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }
winreg = "0.56.0"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
